name: Validation Tests

on: [push, pull_request]

jobs:
  test:
    name: Pytest Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Run Tests
        run: |
          mkdir -p reports
          uv run pytest --junitxml=reports/junit.xml -q --tb=no

      - name: Publish Test Report
        uses: dorny/test-reporter@v3
        if: always()                    # ← Important: run even if tests fail
        with:
          name: Pytest Results
          path: reports/junit.xml
          reporter: java-junit
          fail-on-error: false          # Keep main job status as source of truth

      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results
          path: reports/junit.xml
          retention-days: 7