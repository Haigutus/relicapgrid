name: SHACL SARIF POC

on:
  workflow_dispatch:
  push:
    branches: [shacl-sarif-poc]
    paths:
      - Instance/**
      - buildScripts/validate_shacl_sarif.py
      - .github/workflows/shacl_sarif_poc.yml
      - pyproject.toml

permissions:
  contents: read
  security-events: write

jobs:
  shacl-sarif:
    name: Validate and upload SHACL results to code scanning
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Validate instances, export grouped SARIF + full SHACL reports
        run: uv run buildScripts/validate_shacl_sarif.py

      - name: Upload SHACL SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/shacl-results.sarif
          category: shacl-validation

      - name: Upload SARIF + full SHACL reports as run artifact
        uses: actions/upload-artifact@v4
        with:
          name: shacl-reports
          path: |
            reports/*.sarif
            reports/*-shacl-report.*
            reports/summary.md

      - name: Run summary with link to code scanning results
        run: cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"
